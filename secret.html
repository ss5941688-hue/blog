<body background="passwordbackground.jpeg" text="white">

<style>
  body{
    height:100%;
     cursor:url("pixelcursor.png"),pointer;
  }
    header {
  padding: 50px;
  text-align: left;
  font-size: 17px;
  color: rgb(61, 54, 74);
  font-family: Arial, Helvetica, sans-serif;
}

    form{
        text-align: center;
        background-color: rgba(176, 201, 199, 0.891);
        height:150px;
        width:200px;
        margin-left:40%;
        margin-top:20%;
    }
    
    a:link, a:visited {
  background-color:rgba(176, 201, 199, 0.891);
  color: rgb(0, 0, 0);
  padding: 14px 14px;
  border-color:white;
  border-radius: 10px;

<header>
<a href="index.html">HOME</a>


<form id="loginForm">
    <p><strong>Enter Password to Proceed</strong></p>
  <label for="pwd">Password:</label>
  <input type="password" id="password" name="pwd"><br><br>
  <input type="submit">
</form>

</header>


<script>
const form = document.getElementById("loginForm");

  form.addEventListener("submit", function (e) {
    e.preventDefault(); // stop form from reloading page

    const password = document.getElementById("password").value;
    const secretPassword = "Wallflower4"; // change this

    if (password === secretPassword) {
      window.location.href = "hush.html"; // page to redirect to
    } else { 
      alert("Wrong password, try again.");
    }
  });
</script>
