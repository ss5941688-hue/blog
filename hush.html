<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarah's Corner</title>
<head>
<style>
* {
  box-sizing: border-box;
}
img{
    border-radius:8px
}
a:link, a:visited {
  background-color:rgba(121, 149, 135, 0.838);
  color: rgb(0, 0, 0);
  padding: 14px 14px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  border-radius: 7px;
}

a:hover, a:active {
  background-color: rgb(69, 97, 80);
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* Style the header */
header {
  padding: 20px;
  text-align: center;
  font-size: 40px;
  color: rgb(0, 0, 0);
  background-color:rgba(121, 149, 135, 0.666);
}

/* Create two columns/boxes that floats next to each other */
nav {
  float: left;
  font-size:small;
  width: 100%;
  height: 15%; /* only for demonstration, should be removed */
  padding:15px;
}

/* Style the list inside the menu */
nav ul {
    list-style-type: none;
    padding: 0;
    display:flex;
    flex-direction: row;
    gap:40px;
}


article {
  float: left;
  padding: 30px;
  width: 100%;
  background-color: #f1f1f1bf;
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Style the footer */
footer {
  background-color: #5c3763;
  padding: 30px;
  text-align: center;
  color: white;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  nav, article {
    width: 600px;
    height: 600px;
  }
}
</style>
</head>
